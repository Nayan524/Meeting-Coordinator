[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-coordinator"
version = "0.1.0"
description = "A meeting coordination agent backed by durable workflow execution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
